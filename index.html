<!doctype html>
<html lang="fr">
<head>

  <link rel="icon" href="assets/logo-mark.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Pinyon+Script&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Manrope:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">

<body>
  <a class="skip" href="#main" data-i18n="skip">Aller au contenu</a>

  <header class="bar" id="bar">

      <span class="logo logo--small"><span class="logo__script">Caroline</span><span class="logo__caps">Tour</span></span>
    </a>
    <nav class="bar__nav" aria-label="Navigation">
      <a href="#/tours" data-i18n="nav.tours">Les tours</a>

    <div class="lang" role="group" aria-label="Langue / Language / Idioma">

    <span class="logo logo--small"><span class="logo__script">Caroline</span><span class="logo__caps">Tour</span></span>

  <dialog class="credits" id="credits">
    <h2 data-i18n="foot.credits">Crédits photos</h2>
    <ul id="credits-list"></ul>
    <form method="dialog"><button class="btn btn--ghost" data-i18n="close">Fermer</button></form>

  <script src="script.js" type="module"></script>
